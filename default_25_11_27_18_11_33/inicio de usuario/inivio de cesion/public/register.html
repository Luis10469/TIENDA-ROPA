<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrarse - Tienda Urbana</title>
    <link rel="stylesheet" href="./styles/regitro.css" />
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo" aria-label="Tienda Urbana Logo">Tienda<span class="neon">Urbana</span></a>
            <nav class="nav" aria-label="Menú principal">
                <ul class="nav-list">
                    <li><a href="../../../index.html" class="nav-link">Inicio</a></li>
                    <li><a href="login.html" class="nav-link">Iniciar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="registro-main fade-in">
        <section class="registro-container container">
            <h2 class="section-title">Crear Cuenta</h2>
            <form id="registerForm" action="backend/register.php" method="POST" novalidate class="formulario">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required autocomplete="name" />
                    <span class="form-error" id="error-nombre"></span>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required autocomplete="email" />
                    <span class="form-error" id="error-email"></span>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required autocomplete="new-password" minlength="6" />
                    <span class="form-error" id="error-password"></span>
                </div>
                <button type="submit" class="btn btn-neon neon-hover" aria-label="Enviar registro">Registrarse</button>
            </form>
            <p class="form-footer-text">
                ¿Ya tienes cuenta? <a href="login.html" class="link-neon">Iniciar sesión</a>
            </p>
            <p class="form-footer-text">
                Volver a <a href="./register.html" class="link-neon">Inicio</a>
            </p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
