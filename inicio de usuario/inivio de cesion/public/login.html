<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Inicio de sesión elegante para la boutique de moda urbana con animaciones sofisticadas."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Pulse | Inicio de sesión</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Manrope:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="scene">
      <div class="gradient-shape bg-one"></div>
      <div class="gradient-shape bg-two"></div>
      <div class="gradient-shape bg-three"></div>
    </div>
    <main class="layout">
      <section class="hero-card fade-in">
        <div class="hero-content">
          <p class="eyebrow">Urban Pulse</p>
          <h1>Inicia sesión</h1>
          <p class="subtitle">
            Accede a la colección exclusiva y controla tus pedidos con estilo y
            seguridad premium.
          </p>
        </div>
        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="tucorreo@urban.com"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>
          <button type="submit" class="btn primary" id="submitButton">
            Iniciar sesión
          </button>
          <div class="message" id="statusMessage" aria-live="polite"></div>
        </form>
       <button class="btn secondary" id="registerCta"
        onclick="window.location.href='./register.html'">
    Registrarse ahora
</button>


    </main>
    <script type="module" src="scripts/app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script type="module" src="assets/animation-helper.js"></script>
  </body>
</html>
